name: Deploy Personal Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-stevchrist-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, stevchrist-server]
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: /home/pen/stevchrist-website
    steps:
      - name: Sync repository to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Build & Deploy Docker Container
        run: |
          echo "🐳 Rebuilding and starting personal website container..."
          # Stop old standalone container if present to free port 3000
          docker stop stevchrist-main 2>/dev/null || true
          docker rm stevchrist-main 2>/dev/null || true
          
          # Deploy using docker compose
          docker compose down || true
          docker compose up -d --build
          
          echo "🧹 Pruning unused images..."
          docker image prune -f

      - name: Verify Website Health
        run: |
          echo "⏳ Verifying website response on port 3000..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 >/dev/null 2>&1; then
              echo "✅ Website is UP and healthy (attempt ${i})"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Website failed health check after 60 seconds"
          docker logs --tail 50 personal_website 2>/dev/null || true
          exit 1
