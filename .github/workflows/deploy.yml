name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote SSH Commands on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "=========================================="
            echo "🚀 Starting Automated Deployment on VPS"
            echo "=========================================="
            
            # Navigate to project directory on VPS
            cd ${{ secrets.VPS_TARGET_DIR || '~/personal_website' }}
            
            echo "📥 Fetching and syncing latest code from origin/main..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "🐳 Rebuilding and starting Docker container..."
            if [ -f "docker-compose.yml" ] || [ -f "docker-compose.yaml" ]; then
              docker compose down || true
              docker compose up -d --build
            else
              docker build -t personal_website .
              docker stop personal_website || true
              docker rm personal_website || true
              docker run -d -p 3000:3000 --name personal_website --restart unless-stopped personal_website
            fi
            
            echo "🧹 Pruning dangling docker images to free disk space..."
            docker image prune -f
            
            echo "=========================================="
            echo "✅ Deployment Finished Successfully!"
            echo "=========================================="
